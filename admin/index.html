.pgst{display:flex;flex-wrap:wrap;gap:6px}.pgst span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:15px;color:var(--sub)}.pgst span.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.pgn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pgn small{display:block;color:var(--sub);font-size:14px}.pgn b{font-size:20px}.pgn b.warn{color:var(--warn)}

.acct{color:var(--ink);font-size:20px}.cc{font-size:17px;font-weight:700}.feat{display:flex;flex-wrap:wrap;gap:6px}.feat span{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:15px}.feat span.todo{background:var(--warnbg);color:var(--warn);font-weight:700}

.orow{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;text-align:left;background:var(--soft);border:0;border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer}.orow span{color:var(--ok);font-weight:900}.orow small{color:var(--sub);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card.pg{cursor:pointer}.card.pg:hover{border-color:var(--acc)}.pgo{color:var(--acc);font-weight:700;font-size:17px}

.nowch{font-weight:900;font-size:19px}
@media(max-width:700px){header{gap:8px;padding-top:8px;padding-bottom:8px}header .brand{font-size:19px;order:1;flex:1 1 auto}.who{order:2}.who .btn{min-height:40px;padding:4px 10px}header select{order:3;flex:1 1 0;max-width:none;min-height:42px}header [data-act=addCh]{order:4}.tabs{order:5;width:100%;margin-left:0}.tabs{flex-wrap:wrap}.tabs .btn{flex:1 0 auto;padding:8px 10px;min-height:44px;white-space:nowrap;font-size:17px}}
</style>

<header>
  <div class="brand" id="brand">인스타그램 기획</div>
  <select id="chSel" aria-label="크리에이터"></select>
  <button class="btn sm pdonly" data-act="addCh">크리에이터 추가</button>
  <div class="tabs">
    <button class="btn" data-tab="home">오늘</button>
    <button class="btn" data-tab="board">콘텐츠</button>
    <button class="btn" data-tab="script">대본</button>
    <button class="btn" data-tab="concept">크리에이터</button>
    <button class="btn" data-tab="refs">레퍼런스·분석</button>
  </div>
  <div class="who"><button class="btn sm pdonly" data-tab="people" id="homeBtn">관리 화면</button>
  <button class="btn sm" data-act="logout" title="로그아웃"><span id="meName"></span> · 나가기</button></div>
</header>
<div id="login" hidden><form id="lgForm" class="lgbox"><h1 id="lgTitle">인스타그램 기획</h1><p id="lgSet" hidden>처음 시작합니다. 쓰실 이름과 비밀번호를 지금 정해 주세요. 이 사람이 관리자가 됩니다.</p><label id="lgNameL">이름<input id="lgName" autocomplete="username" required></label><label><span id="lgPwL">비밀번호</span><input id="lgPw" type="password" autocomplete="current-password" required></label><label id="lgPw2L" hidden>비밀번호 한 번 더<input id="lgPw2" type="password" autocomplete="new-password"></label><p id="lgErr" role="alert"></p><button class="btn pri" id="lgBtn">들어가기</button><button type="button" class="btn" id="lgMode">관리자로 들어가기</button></form></div>
<div class="wrap"><div id="msg"></div><div id="toast"><span id="toastT"></span><button data-act="undo">되돌리기</button></div><div id="app"><div class="empty" style="margin-top:24px">불러오는 중입니다</div></div></div>

<script>
(function(){
var STAGES=['방향성','채널명','기획','대본','영상작업','편집','분석','보완'];
var FORMS=['썰','정보 정리','브이로그','검증','개그','기타'];
var S={accts:[],asks:[],tpls:[],sm:'s',fxEdit:false,rchs:[],rv:'ch',rc:null,rcEdit:null,talks:[],role:'',ch:null,sec:-1,sv:null,tab:'home',stage:'all',open:null,refEdit:null,pass:false,form:'all',q:'',channels:[],refs:[],items:[],comments:[],concepts:[],group:true,step:0,undo:null,me:null,names:{},loaded:{},ro:false,addCh:false,del:false};
var db=null,user=null,app=document.getElementById('app'),msg=document.getElementById('msg');
try{var t=sessionStorage.getItem('ws-tab');if(t&&/^(home|board|script|concept|refs|acct|people)$/.test(t))S.tab=t;S.ch=localStorage.getItem('ws-ch')||null}catch(e){}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){if(typeof v==='number')return v;var s=String(v||'').replace(/[, ]/g,'');if(!s)return 0;var m=parseFloat(s);if(isNaN(m))return 0;if(/만/.test(s))m*=10000;else if(/천/.test(s))m*=1000;else if(/k$/i.test(s))m*=1000;return Math.round(m)}
function fmt(n){n=+n||0;if(n>=10000){var x=n/10000;return (x>=100?Math.round(x):Math.round(x*10)/10)+'만'}return n.toLocaleString('ko-KR')}
function mult(r){return r.followers>0&&r.median>0?Math.round(r.median/r.followers*10)/10:0}
function day(ts){if(!ts)return '';var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()}
function who(id){return id?(S.names[id]||'동료'):''}
function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:''}
function chName(){var c=S.channels.filter(function(c){return c.id===S.ch})[0];return c?c.name:''}

function note(t){msg.innerHTML=t?'<div class="note">'+esc(t)+'</div>':''}
function fail(e){if(e&&e.code==='invalid_argument'){S.ro=true;note('저장하지 못했습니다.')}else if(e&&e.code==='quota_exceeded'){note('저장 공간이 가득 찼습니다.')}else{note('저장하지 못했습니다. 잠시 뒤 다시 해 주세요.')}}

/* ---------- 데이터 ---------- */
var q={};function write(key,fn){q[key]=(q[key]||Promise.resolve()).then(fn).catch(fail);return q[key]}
function upd(col,id,data){data.updatedAt=Date.now();return write(col+id,function(){return db.collection(col).doc(id).update(data)})}
function sub(col,key){
  db.collection(col).onSnapshot(function(snap){
    S[key]=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o}).filter(function(o){return !o.deleted});
    if(key==='refs'){S.rchs=S.refs.filter(function(o){return o.kind==='ch'});S.refs=S.refs.filter(function(o){return o.kind!=='ch'})}
    if(!snap.metadata.fromCache||snap.docs.length)S.loaded[key]=true;
    if(!snap.metadata.fromCache){S.loaded[key]=true}
    names();onData(key);
  },function(e){S.loaded[key]=true;note('자료를 불러오지 못했습니다. 페이지를 닫았다 다시 열어 주세요.');render()});
}
function names(){
  if(!user||!user.profiles)return;var ids={};
  S.items.concat(S.comments,S.refs).forEach(function(o){if(o.by&&!(o.by in S.names))ids[o.by]=1});
  ids=Object.keys(ids);if(!ids.length)return;ids.forEach(function(i){S.names[i]=''});
  user.profiles(ids.slice(0,64)).then(function(ps){ids.forEach(function(i){S.names[i]=(ps&&ps[i]&&ps[i].name)||''});render(true)}).catch(function(){});
}
function onData(key){
  if(key==='channels'){if(S.channels.length&&!S.channels.some(function(c){return c.id===S.ch}))S.ch=S.channels.slice().sort(byOrder)[0].id;head()}
  render(true);
}
function byOrder(a,b){return (a.order||0)-(b.order||0)||(a.at||0)-(b.at||0)}

/* ---------- 화면 ---------- */
function head(){
  var sel=document.getElementById('chSel');
  sel.innerHTML=S.channels.slice().sort(byOrder).map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===S.ch?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')||'<option>크리에이터 없음</option>';
  [].forEach.call(document.querySelectorAll('[data-tab]'),function(b){b.classList.toggle('on',(b.dataset.tab===S.tab||(b.dataset.tab==='refs'&&S.tab==='acct'))&&!S.open)});
  var home=S.role==='pd'&&(S.tab==='people'||S.addCh);document.body.classList.toggle('home',home);
  var hb=document.getElementById('homeBtn');if(hb)hb.textContent=home?'관리 화면':'← 관리 화면';
}
function render(soft){
  head();
  var ready=S.loaded.channels&&S.loaded.items&&S.loaded.refs;
  if(!ready)return;
  if(soft&&document.activeElement&&app.contains(document.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){softSync();return}
  if(S.addCh){app.innerHTML=chForm();return}
  if(S.tab==='people'){app.innerHTML=peopleHtml();return}
  if(!S.channels.length){app.innerHTML=S.role==='pd'?'<div class="empty" style="margin-top:24px">아직 크리에이터가 없습니다.<br><br><button class="btn pri" data-act="addCh">첫 크리에이터 만들기</button></div>':'<div class="empty" style="margin-top:24px">아직 이 계정에 연결된 크리에이터가 없습니다.<br>관리자에게 연결해 달라고 말해 주세요.</div>';return}
  if(S.open){var it=S.items.filter(function(i){return i.id===S.open})[0];if(it){app.innerHTML=editor(it);return}S.open=null}
  if(S.refEdit){app.innerHTML=refForm();return}
  app.innerHTML=S.tab==='people'?peopleHtml():S.tab==='refs'?subNav()+refs():S.tab==='acct'?subNav()+accts():S.tab==='concept'?concept():S.tab==='script'?scripts():S.tab==='board'?board():home();
}
/* 입력 중일 때는 화면을 다시 그리지 않고, 상대가 바꾼 다른 칸만 맞춘다 */
function softSync(){
  if(S.tab==='concept'&&!S.open){var c=curConcept();[].forEach.call(app.querySelectorAll('[data-c]'),function(el){if(el!==document.activeElement&&!el.dataset.dirty){var v=c[el.dataset.c]==null?'':String(c[el.dataset.c]);if(el.value!==v)el.value=v}});var g=document.getElementById('grow');if(g)g.innerHTML=growStats(c);return}
  if(S.open){var it=S.items.filter(function(i){return i.id===S.open})[0];if(!it)return;
    [].forEach.call(app.querySelectorAll('[data-f]'),function(el){if(el!==document.activeElement&&!el.dataset.dirty){var v=it[el.dataset.f]==null?'':String(it[el.dataset.f]);if(el.dataset.f==='stage')v=GSTAGE[grp(v)];if(el.value!==v)el.value=v}});
    var sc=it.scenes||[];[].forEach.call(app.querySelectorAll('[data-sc]'),function(el){if(el!==document.activeElement&&!sceneDirty){var a=el.dataset.sc.split(':'),r=sc[+a[0]];if(r){var v=r[a[1]]==null?'':String(r[a[1]]);if(el.value!==v)el.value=v}}});
    var k=document.getElementById('calc');if(k)k.innerHTML=calc(it);
    var c=document.getElementById('cms');if(c)c.innerHTML=cmList(it.id)}
}

/* ---------- 단계 묶음, 편 번호 ---------- */
var GROUPS=['기획','대본','촬영·편집','올림·돌아보기'],GSTAGE=['기획','대본','영상작업','분석'],GDO=['기획 하기','대본 쓰기','촬영·편집 하기','올리고 돌아보기'];
function grp(s){var i=STAGES.indexOf(s);return i<=2?0:i===3?1:i<=5?2:3}
function chItems(){return S.items.filter(function(i){return i.ch===S.ch})}
function epMap(items){var m={},by={};items.slice().sort(byOrder).forEach(function(i){if(!i.corner)return;by[i.corner]=(by[i.corner]||0)+1;m[i.id]=by[i.corner]});return m}
function epName(i,ep){return (ep[i.id]?ep[i.id]+'편 · ':'')+(i.title||'제목 없음')}
function scFilled(i){return (i.scenes||[]).filter(function(x){return (x.line||x.sub||x.screen||'').trim()})}
function nextAct(i){var d=stepDone(i),g=grp(i.stage);
  if(g===0)return !d[0]?'레퍼런스 고르기':!d[1]?'기획 적기':'대본으로 넘기기';
  if(g===1){var n=scFilled(i).length;return n?'대본 '+(i.scenes||[]).length+'줄 중 '+n+'줄':'대본 쓰기'}
  if(g===2){var l=(i.scenes||[]).filter(function(x){return (x.screen||'').trim()}),dn=(i.shotDone||[]).length;return l.length?'촬영 '+l.length+'컷 중 '+Math.min(dn,l.length)+'컷':'촬영 준비'}
  return num(i.views)?'조회 '+fmt(num(i.views))+(i.lesson?' · 배운 점 적음':' · 배운 점 적기'):(i.url||i.posted?'성과 적기':'올리기')}
function allCorners(items){var cs=corners().slice();items.forEach(function(i){if(i.corner&&cs.indexOf(i.corner)<0)cs.push(i.corner)});return cs}
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

/* ---------- 오늘 ---------- */
function nowItem(items){
  var c=items.filter(function(i){return !(grp(i.stage)===3&&num(i.views)>0&&i.lesson)});
  var pr=[1,2,3,0];
  return c.sort(function(a,b){return (b.title?1:0)-(a.title?1:0)||pr[grp(b.stage)]-pr[grp(a.stage)]||(b.updatedAt||b.at||0)-(a.updatedAt||a.at||0)})[0];
}
function home(){
  var items=chItems(),ep=epMap(items),c=curConcept(),it=nowItem(items),h='<div class="hm">'+startCard(items,c);
  /* 지금 할 일 */
  h+='<div class="hg2"><div class="panel big"><span class="badge acc">지금 할 일</span>';
  if(it){var f=fxOf(it.corner),fx=f[f.length-1];
    h+='<div class="bt">'+esc((it.corner?it.corner+' ':'')+(ep[it.id]?ep[it.id]+'편':(it.title||'제목 없음')))+' · '+GDO[grp(it.stage)]+'</div><div class="bs">'+(it.corner&&ep[it.id]&&it.title?esc(it.title)+' · ':'')+esc(nextAct(it))+(fx&&fx.hook?'<br>이 코너의 첫 3초: '+esc(fx.hook):'')+'</div><div class="bar" style="margin:0"><button class="btn pri" data-open="'+esc(it.id)+'">이어서 하기</button><button class="btn" data-tab="board">다른 편 고르기</button><button class="btn" data-act="svOpen" data-id="'+esc(it.id)+'">대본 보기</button></div>';
  }else h+='<div class="bt">첫 콘텐츠를 만들 차례입니다</div><div class="bs">코너를 고르고 1편부터 시작합니다.</div><div class="bar" style="margin:0">'+(S.ro?'':'<button class="btn pri" data-act="newItem">새 콘텐츠</button>')+'<button class="btn" data-tab="concept">크리에이터 먼저 정하기</button></div>';
  h+='</div>';
  /* 같이 정할 것 */
  var ts=(S.talks||[]).filter(function(t){return t.ch===S.ch&&!t.decided}).sort(function(a,b){return (b.at||0)-(a.at||0)});
  h+='<div class="panel"><h2>같이 정할 것 '+(ts.length?'<span class="badge warn">'+ts.length+'</span>':'')+'</h2>';
  if(!ts.length)h+='<div style="color:var(--sub)">지금 정할 것이 없습니다. 정할 것은 크리에이터 화면이나 콘텐츠 안에서 올립니다.</div>';
  ts.slice(0,5).forEach(function(t){var ms=(S.comments||[]).filter(function(m){return m.talk===t.id}).sort(function(a,b){return (a.at||0)-(b.at||0)}),l=ms[ms.length-1];
    var mine=l&&l.by===S.me,tg=!l?'<span class="badge">의견 없음</span>':mine?'<span class="badge">답 기다림</span>':'<span class="badge acc">내가 답할 차례</span>';
    h+='<button class="rowl" data-act="goTalk" data-scope="'+esc(t.scope||'')+'"><b>'+esc(t.q)+'</b>'+tg+'</button>'});
  if(ts.length>5)h+='<div style="color:var(--sub)">외 '+(ts.length-5)+'개</div>';
  h+='</div></div>';
  /* 이번 주 */
  var now=new Date(),mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)),td=ymd(now),goal=parseInt(String(c.freq||'').replace(/[^0-9]/g,''),10)||0,up=0,days='';
  ['월','화','수','목','금','토','일'].forEach(function(n,k){var d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+k),s=ymd(d),x='',posted=false;
    items.forEach(function(i){if(i.posted===s){posted=true;up++;x+='<button class="wi up" data-open="'+esc(i.id)+'">올림 · '+esc(epName(i,ep))+(num(i.views)?'<br>조회 '+fmt(num(i.views)):'')+'</button>'}
      else if(i.due===s)x+='<button class="wi" data-open="'+esc(i.id)+'">촬영 · '+esc(epName(i,ep))+'</button>'});
    days+='<div class="wd'+(s===td?' td':'')+(posted?' up':'')+'"><b>'+n+' '+(d.getMonth()+1)+'/'+d.getDate()+(s===td?' · 오늘':'')+'</b>'+x+'</div>'});
  h+='<div class="panel"><h2>이번 주 <small class="hs">'+(goal?'목표 주 '+goal+'편 · 올림 '+up+' · 남은 '+Math.max(0,goal-up):'올림 '+up+'편 · 한 주에 몇 편 올릴지 정하면 남은 편수가 나옵니다')+'</small></h2><div class="wk">'+days+'</div><div class="guide">콘텐츠에 촬영 날짜와 게시한 날을 적으면 여기에 뜹니다.'+(goal?'':' <button class="btn sm" data-sec="2" data-go="concept">목표 정하기</button>')+'</div></div>';
  /* 세 가지 */
  h+='<div class="hg3">';
  var ls=items.filter(function(i){return i.lesson}).sort(function(a,b){return String(b.posted||'').localeCompare(String(a.posted||''))||(b.updatedAt||0)-(a.updatedAt||0)})[0];
  h+='<div class="panel"><h2>지난 영상에서 배운 점</h2>'+(ls?'<div class="hs">'+esc(epName(ls,ep))+(im(ls)?' · 팔로워의 '+im(ls)+'배':'')+'</div><b>'+esc(ls.lesson)+'</b><button class="btn sm" style="justify-self:start" data-open="'+esc(ls.id)+'">열기</button>':'<div style="color:var(--sub)">영상을 올리고 성과와 배운 점을 적으면 여기에 뜹니다. 다음 편을 쓸 때도 같이 보입니다.</div>')+'</div>';

    if(u.id!==S.me)h+='<button class="btn sm" data-act="pRole" data-id="'+esc(u.id)+'" data-role="'+(u.role==='pd'?'creator':'pd')+'">'+(u.role==='pd'?'크리에이터로':'관리자로')+'</button><button class="btn sm'+(u.off?'':' bad')+'" data-act="pOff" data-id="'+esc(u.id)+'" data-off="'+(u.off?0:1)+'">'+(u.off?'다시 쓰게':'못 들어오게')+'</button>';
    h+='</div>'});
  h+='<div class="pnew"><input id="pName" placeholder="이름 (아이디)"><select id="pRole"><option value="creator">크리에이터</option><option value="pd">관리자</option></select><select id="pCh"><option value="">맡을 크리에이터 (나중에)</option><option value="+new">이 이름으로 새로 만들기</option>'+chs.filter(function(c){return !c.owner}).map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'}).join('')+'</select><input id="pPwIn" type="password" autocomplete="new-password" placeholder="비밀번호 (6자 이상)"><button class="btn pri" data-act="pAdd">계정 더하기</button></div><p id="pMsg" class="guide"></p></div>';
  return h;
}
var PERR={dup:'같은 이름이 이미 있습니다.',pw:'비밀번호는 6자 이상으로 해 주세요.',name:'이름을 20자 안으로 적어 주세요.',forbidden:'관리자만 할 수 있습니다.',lastpd:'관리자가 한 명은 있어야 합니다.'};
function own(chId,uid){var c=S.channels.filter(function(x){return x.id===chId})[0];if(!c)return;upd('channels',chId,{owner:uid})}
function peopleAct(a,d){
  var m=document.getElementById('pMsg');
  if(a==='pOpen'){S.ch=d.id;try{localStorage.setItem('ws-ch',d.id)}catch(e){}return setTab('home')}
  if(a==='pAdd'){var n=document.getElementById('pName').value.trim(),p=document.getElementById('pPwIn').value,r=document.getElementById('pRole').value,cv=document.getElementById('pCh').value;
    call('/users/add',{name:n,role:r,pw:p}).then(function(j){if(j.ok){
      if(r==='creator'&&cv==='+new'){var ref=db.collection('channels').doc();write('ch'+ref.id,function(){return ref.set({name:n,order:Date.now(),at:Date.now(),by:S.me,owner:j.id})})}
      else if(r==='creator'&&cv)own(cv,j.id);
      PEOPLE=null;render();note(n+' 계정을 만들었습니다. 이름과 비밀번호를 따로 보내 주세요.')}else if(m)m.textContent=PERR[j.err]||'만들지 못했습니다.'});return}
  if(a==='aMake'){var am=document.getElementById('aMsg'),p1=document.getElementById('aPw').value,p2=document.getElementById('aPw2').value;
    if(p1.length<6){am.textContent='비밀번호는 6자 이상으로 해 주세요.';return}if(p1!==p2){am.textContent='두 비밀번호가 다릅니다.';return}
    call('/users/add',{name:ADMIN_NAME,role:'pd',pw:p1}).then(function(j){if(!j.ok){am.textContent=PERR[j.err]||'만들지 못했습니다.';return}
      call('/users/set',{id:S.me,role:'creator'}).then(function(){sess(null);HASADM=true;admMode(true);showLogin('관리자 계정을 만들었습니다. 관리자 비밀번호로 들어와 주세요.')})});return}
  if(a==='pOff'){call('/users/set',{id:d.id,off:d.off==='1'}).then(function(){PEOPLE=null;render()});return}
  if(a==='pRole'){call('/users/set',{id:d.id,role:d.role}).then(function(j){if(j.ok){PEOPLE=null;render()}else note(PERR[j.err]||'바꾸지 못했습니다.')});return}
  if(a==='pPw'){var row=app.querySelector('[data-act="pPw"][data-id="'+d.id+'"]').parentNode;if(row.querySelector('.pnpw'))return;
    row.insertAdjacentHTML('beforeend','<input class="pnpw" type="password" autocomplete="new-password" placeholder="새 비밀번호"><button class="btn sm pri" data-act="pPwGo" data-id="'+esc(d.id)+'">저장</button>');row.querySelector('.pnpw').focus();return}
  if(a==='pPwGo'){var row2=app.querySelector('[data-act="pPwGo"][data-id="'+d.id+'"]').parentNode,v=row2.querySelector('.pnpw').value;
    call('/users/set',{id:d.id,pw:v}).then(function(j){if(j.ok){if(d.id===S.me){sess(null);showLogin('비밀번호를 바꿨습니다. 새 비밀번호로 들어와 주세요.')}else{PEOPLE=null;render();note('비밀번호를 바꿨습니다.')}}else note(PERR[j.err]||'바꾸지 못했습니다.')});return}
}
/* ---------- 저장 서버 연결 (계정 없이 이름 + 비밀번호) ---------- */
var API=(window.APP_CFG&&APP_CFG.api)||'';
var ADMIN_PAGE=/\/admin\/?(index\.html)?$/.test(location.pathname);
var SK=ADMIN_PAGE?'ip_session_adm':'ip_session';
function sess(v){try{if(v===undefined)return JSON.parse(localStorage.getItem(SK)||'null');if(v===null)localStorage.removeItem(SK);else localStorage.setItem(SK,JSON.stringify(v))}catch(e){return null}}
function call(path,body){var s=sess();return fetch(API+path,{method:'POST',headers:Object.assign({'content-type':'application/json'},s&&s.token?{authorization:'Bearer '+s.token}:{}),body:JSON.stringify(body||{})}).then(function(r){return r.json().catch(function(){return {err:'net'}}).then(function(j){if(r.status===401){sess(null);showLogin('로그인이 풀렸습니다. 다시 들어와 주세요.')}return j})})}
var CACHE={},SUBS={},SINCE=0,PULLING=false;
function emit(col){var m=CACHE[col]||{};var docs=Object.keys(m).map(function(id){return {id:id,data:function(){return m[id]}}});(SUBS[col]||[]).forEach(function(f){f({docs:docs,metadata:{fromCache:false}})})}
function pull(){if(PULLING||!sess())return Promise.resolve();PULLING=true;return call('/pull',{since:SINCE}).then(function(j){PULLING=false;if(!j||j.err){if(j&&j.err==='net')note('서버에 닿지 않습니다. 인터넷 연결을 확인해 주세요.');return}
  Object.assign(S.names,j.names||{});var ch={};(j.docs||[]).forEach(function(d){(CACHE[d.col]=CACHE[d.col]||{})[d.id]=d.data;ch[d.col]=1;if(d.upd>SINCE)SINCE=d.upd});if(j.last>SINCE)SINCE=j.last;if(j.more)setTimeout(pull,50);
  ['channels','items','refs','comments','concepts','talks','accts','asks','tpls'].forEach(function(c){if(ch[c]||!S.loaded[c])emit(c)})}).catch(function(){PULLING=false;note('서버에 닿지 않습니다. 인터넷 연결을 확인해 주세요.')})}
function send(col,id,op,data){(CACHE[col]=CACHE[col]||{});CACHE[col][id]=op==='update'?Object.assign({},CACHE[col][id],data):data;emit(col);
  return call('/write',{list:[{col:col,id:id,op:op,data:data}]}).then(function(j){var o=j&&j.out&&j.out[0];if(!o||!o.ok){var e=new Error('save');e.code=j&&j.err;throw e}})}
function newId(){var a=new Uint8Array(10);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(x){return 'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]}).join('')}
var db={collection:function(col){return {
  doc:function(id){id=id||newId();return {id:id,set:function(d){return send(col,id,'set',d)},update:function(d){return send(col,id,'update',d)}}},
  add:function(d){return send(col,newId(),'set',d)},
  onSnapshot:function(f){(SUBS[col]=SUBS[col]||[]).push(f)}}}};
var user=null;
function showLogin(why){var g=document.getElementById('login');g.hidden=false;checkSetup();document.getElementById('lgErr').textContent=why||'';var n=document.getElementById('lgName');(n.value||ADM?document.getElementById('lgPw'):n).focus()}
function started(me){
  if(ADMIN_PAGE&&me.role!=='pd'){sess(null);showLogin('이 주소는 관리자만 들어옵니다. 크리에이터는 크리에이터 주소로 들어와 주세요.');return}
  if(!ADMIN_PAGE&&me.role==='pd'){try{localStorage.setItem('ip_session_adm',localStorage.getItem('ip_session'));localStorage.removeItem('ip_session')}catch(e){}location.replace('admin/');return}
  PEOPLE=null;if(ADMIN_PAGE){var st=null;try{st=sessionStorage.getItem('ws-tab')}catch(e){}if(!st)S.tab='people'}S.me=me.id;S.role=me.role;S.names[me.id]=me.name;document.getElementById('login').hidden=true;document.getElementById('meName').textContent=(me.name===ADMIN_NAME?me.name:me.name+(me.role==='pd'?' · 관리자':' · 크리에이터'));document.body.classList.toggle('is-pd',me.role==='pd');
  sub('channels','channels');sub('items','items');sub('refs','refs');sub('comments','comments');sub('concepts','concepts');sub('talks','talks');sub('accts','accts');sub('asks','asks');sub('tpls','tpls');
  pull();if(!started.on){started.on=1;setInterval(function(){if(!document.hidden)pull()},4000);document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()})}}
var SETUP=false,ADM=false,HASADM=false,ADMIN_NAME='관리자';
function admMode(on){ADM=!!on;try{localStorage.setItem('ip_adm',ADM?'1':'')}catch(e){}var nl=document.getElementById('lgNameL'),n=document.getElementById('lgName');nl.hidden=ADM&&!SETUP;n.required=!(ADM&&!SETUP);
  document.getElementById('lgMode').hidden=true;document.getElementById('lgMode').textContent=ADM?'크리에이터로 들어가기':'관리자로 들어가기';document.getElementById('lgPwL').textContent=SETUP?'비밀번호 정하기 (6자 이상)':ADM?'관리자 비밀번호':'비밀번호'}
document.getElementById('lgMode').addEventListener('click',function(){admMode(!ADM);document.getElementById('lgErr').textContent='';document.getElementById(ADM?'lgPw':'lgName').focus()});
function setupMode(on){SETUP=on;document.getElementById('lgSet').hidden=!on;document.getElementById('lgPw2L').hidden=!on;document.getElementById('lgPwL').textContent=on?'비밀번호 정하기 (6자 이상)':'비밀번호';document.getElementById('lgBtn').textContent=on?'시작하기':'들어가기';admMode(on?false:ADM);document.getElementById('lgPw').autocomplete=on?'new-password':'current-password'}
function checkSetup(){call('/state',{}).then(function(j){HASADM=!!(j&&j.admin);ADM=ADMIN_PAGE&&HASADM;setupMode(!!(j&&j.setup));if(ADMIN_PAGE&&!HASADM&&!SETUP&&!document.getElementById('lgErr').textContent)document.getElementById('lgErr').textContent='관리자 계정이 아직 없습니다. 지금 관리자 권한이 있는 계정의 이름과 비밀번호로 들어와 관리자 계정을 만들어 주세요.'})}
document.getElementById('lgForm').addEventListener('submit',function(e){e.preventDefault();var b=document.getElementById('lgBtn');
  if(SETUP){var p1=document.getElementById('lgPw').value,p2=document.getElementById('lgPw2').value;if(p1.length<6){document.getElementById('lgErr').textContent='비밀번호는 6자 이상으로 정해 주세요.';return}if(p1!==p2){document.getElementById('lgErr').textContent='두 비밀번호가 다릅니다. 같게 넣어 주세요.';return}}
  b.disabled=true;
  call('/login',{name:ADM&&!SETUP?ADMIN_NAME:document.getElementById('lgName').value,pw:document.getElementById('lgPw').value}).then(function(j){b.disabled=false;
    if(j&&j.token){sess({token:j.token,me:j.me});if(S.me){location.reload();return}document.getElementById('lgPw').value='';document.getElementById('lgPw2').value='';setupMode(false);started(j.me)}
    else document.getElementById('lgErr').textContent=j&&j.err==='locked'?'여러 번 틀려 잠시 잠겼습니다. '+(j.wait||15)+'분 뒤 다시 해 주세요.':j&&j.err==='net'?'서버에 닿지 않습니다.':(ADM?'관리자 비밀번호가 맞지 않습니다.':'이름 또는 비밀번호가 맞지 않습니다.')})});

/* ---------- 시작 ---------- */
head();
document.getElementById('brand').textContent=document.title=((window.APP_CFG&&APP_CFG.name)||'인스타그램 기획')+(ADMIN_PAGE?' · 관리자':'');document.getElementById('lgTitle').textContent=document.title;
var S0=sess();if(S0&&S0.token){started(S0.me);call('/me').then(function(j){if(j&&j.me){sess({token:S0.token,me:j.me});S.role=j.me.role;document.body.classList.toggle('is-pd',j.me.role==='pd')}})}else showLogin();
})();
</script>
