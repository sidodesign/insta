<title>인스타그램 기획</title>
<meta name="robots" content="noindex">
<script src="config.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--paper:#fff;--ink:#16181D;--sub:#565C67;--line:#D5D9E0;--acc:#1D4ED8;--accbg:#E7EEFF;--ok:#0B7A4B;--okbg:#E2F5EA;--warn:#B45309;--warnbg:#FFF1D6;--bad:#B42318;--soft:#ECEEF2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101216;--paper:#1A1D24;--ink:#F1F2F5;--sub:#AEB4BF;--line:#373C47;--acc:#8FB0FF;--accbg:#1E2A4A;--ok:#5DD39E;--okbg:#143326;--warn:#F5B453;--warnbg:#3A2B10;--bad:#FF8A7A;--soft:#232730}}
:root[data-theme="dark"]{--bg:#101216;--paper:#1A1D24;--ink:#F1F2F5;--sub:#AEB4BF;--line:#373C47;--acc:#8FB0FF;--accbg:#1E2A4A;--ok:#5DD39E;--okbg:#143326;--warn:#F5B453;--warnbg:#3A2B10;--bad:#FF8A7A;--soft:#232730}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:18px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding:0 max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
@media(min-width:900px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
@media(max-width:800px){header{position:static}}
@media(min-width:900px){header{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
header .brand{font-weight:900;font-size:22px;margin-right:4px}
.tabs{display:flex;gap:6px;margin-left:auto}
.btn{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;min-height:46px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.on{background:var(--acc);border-color:var(--acc);color:var(--paper)}
.btn.sm{padding:5px 12px;min-height:38px;font-size:16px}
.btn.bad{color:var(--bad)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
select,input,textarea{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:9px 12px;min-height:46px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.6}
header select{width:auto;font-weight:700;max-width:60vw}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 14px}
.bar .sp{margin-left:auto}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:16px;min-height:40px}
.chip b{color:var(--sub);font-weight:700;margin-left:4px}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}.chip.on b{color:var(--acc)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px;align-content:start}
.card h3{margin:0;font-size:21px;line-height:1.35;font-weight:900}
.card.click{cursor:pointer;text-align:left}
.card.click:hover{border-color:var(--acc)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--sub);font-size:16px}
.badge{display:inline-block;border-radius:8px;padding:2px 10px;font-weight:700;font-size:15px;background:var(--soft);color:var(--ink)}
.badge.acc{background:var(--accbg);color:var(--acc)}.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums div{background:var(--soft);border-radius:12px;padding:8px 10px}
.nums small{display:block;color:var(--sub);font-size:14px}
.nums b{white-space:nowrap;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.nums .x b{color:var(--ok)}.nums .x.no b{color:var(--sub)}
.row{display:grid;grid-template-columns:84px 1fr;gap:8px;font-size:17px}
.row span{color:var(--sub);font-size:15px;padding-top:2px}
.empty{background:var(--paper);border:2px dashed var(--line);border-radius:18px;padding:36px 20px;text-align:center;color:var(--sub)}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;font-weight:700;margin-top:14px}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:20px;margin-top:18px;display:grid;gap:16px}
.panel h2{margin:0;font-size:24px;font-weight:900}
.f{display:grid;gap:6px}
.f label{font-weight:900;font-size:17px}
.f label small{font-weight:500;color:var(--sub);margin-left:8px}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.two{display:grid;gap:18px}
@media(min-width:1100px){.two{grid-template-columns:1.6fr 1fr;align-items:start}}
.title-in{font-size:24px;font-weight:900}
.cm{background:var(--soft);border-radius:14px;padding:10px 14px}
.cm small{color:var(--sub);display:block;font-size:14px}
.saved{color:var(--sub);font-size:15px}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.h1{font-size:26px;font-weight:900;margin:0}
.lay{display:grid;gap:10px}.lay>div{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.lay>div:nth-child(2){margin-left:28px}.lay>div:nth-child(3){margin-left:56px}
.lay i{font-style:normal;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accbg);color:var(--acc);font-weight:900}
.lay>div:nth-child(3) i{background:var(--acc);color:var(--paper)}
@media(max-width:800px){.lay>div:nth-child(2){margin-left:10px}.lay>div:nth-child(3){margin-left:20px}}
.stat{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:6px 0 4px}
.stat>div{background:var(--soft);border-radius:14px;padding:12px 14px}.stat small{display:block;color:var(--sub);font-size:14px}.stat b{font-size:26px;font-weight:900}
.prog{height:14px;border-radius:7px;background:var(--soft);overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--ok)}
.rowl{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:10px 14px;cursor:pointer;border:0;width:100%;text-align:left;font:inherit;color:inherit;min-height:48px}
.rowl span{color:var(--sub);font-size:15px;white-space:nowrap}
.corner{display:grid;gap:8px;align-content:start}
.ver{font-size:13px;color:var(--sub);font-weight:500;margin-left:6px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 14px}
.step{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 16px 8px 8px;font-weight:700;cursor:pointer;min-height:50px}
.step i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:900}
.step.done i{background:var(--okbg);color:var(--ok)}
.step.on{border-color:var(--acc);background:var(--accbg);color:var(--acc)}.step.on i{background:var(--acc);color:var(--paper)}
.dots{display:flex;gap:5px;align-items:center}.dots i{width:22px;height:8px;border-radius:4px;background:var(--soft)}.dots i.d{background:var(--ok)}
.sc{display:grid;grid-template-columns:120px 1fr 1.4fr 84px 50px;gap:8px;align-items:start}
.sc textarea{min-height:76px}.sch{font-size:15px;color:var(--sub);font-weight:700}
@media(max-width:800px){.sc{grid-template-columns:1fr 84px 50px;border-top:1px solid var(--line);padding-top:10px}.sc textarea{grid-column:1/-1}.sch{display:none}}
.mini{background:var(--soft);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.calc{background:var(--soft);border-radius:14px;padding:14px 16px;display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.calc b{font-size:28px;font-weight:900}.calc .ok{color:var(--ok)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 18px;display:none;gap:12px;align-items:center;z-index:9;font-weight:700;max-width:calc(100vw - 32px)}
#toast button{background:var(--bg);color:var(--ink);border:0;border-radius:10px;padding:8px 14px;font-weight:900;cursor:pointer}
.guide{color:var(--sub);font-size:16px;margin:0}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;color:var(--acc);font-size:16px;min-height:32px}
.sec{display:flex;gap:10px;align-items:center;margin:26px 0 12px;padding-top:18px;border-top:2px solid var(--line)}
.bar+.sec{border-top:0;padding-top:0;margin-top:8px}
#login[hidden]{display:none}#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px}
.lgbox{width:100%;max-width:400px;display:grid;gap:14px}.lgbox h1{font-size:28px;margin:0 0 6px}.lgbox label{display:grid;gap:6px;font-weight:700}
#login [hidden]{display:none!important}#lgSet{margin:0;color:var(--sub)}#lgErr{color:var(--bad);min-height:1.5em;margin:0;font-weight:700}.lgbox .btn{min-height:54px;font-size:19px}
.pdonly{display:none}body.is-pd .pdonly{display:inline-block}
.talk{background:var(--paper);border:2px solid var(--acc);border-radius:18px;padding:16px;margin:14px 0}
.talkh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.talkh h2{margin:0;font-size:21px}.talkh span{color:var(--sub);font-size:16px}
.tk{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.tq b{font-size:19px}.tq small{display:block;color:var(--sub);font-size:15px}
.tm{border-radius:14px;padding:9px 12px;margin:8px 0 0;max-width:560px}.tm small{display:block;font-size:13px;font-weight:700}
.tm.pd{background:var(--accbg)}.tm.pd small{color:var(--acc)}.tm.cr{background:var(--warnbg)}.tm.cr small{color:var(--warn)}
.tin,.tnew,.pnew{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.tin input,.tnew input{flex:1 1 220px}.tnew select{flex:0 1 220px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.tdone{margin-top:12px}.tdone summary{font-weight:700;cursor:pointer;min-height:40px}.td{border:2px solid var(--ok);border-radius:14px;padding:10px 12px;margin-top:8px}.td b{color:var(--ok)}.td small{display:block;color:var(--sub);font-size:14px}.td .btn{margin-top:6px}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px 0}.prow b{font-size:19px}.prow span{color:var(--sub)}.prow .me{color:var(--acc);font-weight:700}.prow .pnpw{flex:1 1 180px;width:auto}
.pnew input{flex:1 1 160px;width:auto}.pnew select{flex:0 1 150px;width:auto}
.who{display:flex;gap:6px}
@media(max-width:700px){header{gap:8px;padding-top:8px;padding-bottom:8px}header .brand{font-size:19px;order:1;flex:1 1 auto}.who{order:2}.who .btn{min-height:40px;padding:4px 10px}header select{order:3;flex:1 1 0;max-width:none;min-height:42px}header [data-act=addCh]{order:4}.tabs{order:5;width:100%;margin-left:0}.tabs .btn{flex:1 1 0;padding:8px 4px;min-height:44px}}
</style>

<header>
  <div class="brand" id="brand">인스타그램 기획</div>
  <select id="chSel" aria-label="크리에이터"></select>
  <button class="btn sm" data-act="addCh">크리에이터 추가</button>
  <div class="tabs">
    <button class="btn" data-tab="concept">크리에이터</button>
    <button class="btn" data-tab="board">진행판</button>
    <button class="btn" data-tab="refs">인플루언서</button>
  </div>
  <div class="who"><button class="btn sm pdonly" data-tab="people">사람</button>
  <button class="btn sm" data-act="logout" title="로그아웃"><span id="meName"></span> · 나가기</button></div>
</header>
<div id="login" hidden><form id="lgForm" class="lgbox"><h1 id="lgTitle">인스타그램 기획</h1><p id="lgSet" hidden>처음 시작합니다. 쓰실 이름과 비밀번호를 지금 정해 주세요. 이 사람이 PD 가 됩니다.</p><label>이름<input id="lgName" autocomplete="username" required></label><label><span id="lgPwL">비밀번호</span><input id="lgPw" type="password" autocomplete="current-password" required></label><label id="lgPw2L" hidden>비밀번호 한 번 더<input id="lgPw2" type="password" autocomplete="new-password"></label><p id="lgErr" role="alert"></p><button class="btn pri" id="lgBtn">들어가기</button></form></div>
<div class="wrap"><div id="msg"></div><div id="toast"><span id="toastT"></span><button data-act="undo">되돌리기</button></div><div id="app"><div class="empty" style="margin-top:24px">불러오는 중입니다</div></div></div>

<script>
(function(){
var STAGES=['방향성','채널명','기획','대본','영상작업','편집','분석','보완'];
var FORMS=['썰','정보 정리','브이로그','검증','개그','기타'];
var S={talks:[],role:'',ch:null,sec:0,tab:'concept',stage:'all',open:null,refEdit:null,pass:false,form:'all',q:'',channels:[],refs:[],items:[],comments:[],concepts:[],group:true,step:0,undo:null,me:null,names:{},loaded:{},ro:false,addCh:false,del:false};
var db=null,user=null,app=document.getElementById('app'),msg=document.getElementById('msg');
try{var t=sessionStorage.getItem('ws-tab');if(t)S.tab=t;S.ch=localStorage.getItem('ws-ch')||null}catch(e){}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){if(typeof v==='number')return v;var s=String(v||'').replace(/[, ]/g,'');if(!s)return 0;var m=parseFloat(s);if(isNaN(m))return 0;if(/만/.test(s))m*=10000;else if(/천/.test(s))m*=1000;else if(/k$/i.test(s))m*=1000;return Math.round(m)}
function fmt(n){n=+n||0;if(n>=10000){var x=n/10000;return (x>=100?Math.round(x):Math.round(x*10)/10)+'만'}return n.toLocaleString('ko-KR')}
function mult(r){return r.followers>0&&r.median>0?Math.round(r.median/r.followers*10)/10:0}
function day(ts){if(!ts)return '';var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()}
function who(id){return id?(S.names[id]||'동료'):''}
function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:''}
function chName(){var c=S.channels.filter(function(c){return c.id===S.ch})[0];return c?c.name:''}

function note(t){msg.innerHTML=t?'<div class="note">'+esc(t)+'</div>':''}
function fail(e){if(e&&e.code==='invalid_argument'){S.ro=true;note('저장하지 못했습니다.')}else if(e&&e.code==='quota_exceeded'){note('저장 공간이 가득 찼습니다.')}else{note('저장하지 못했습니다. 잠시 뒤 다시 해 주세요.')}}

/* ---------- 데이터 ---------- */
var q={};function write(key,fn){q[key]=(q[key]||Promise.resolve()).then(fn).catch(fail);return q[key]}
function upd(col,id,data){data.updatedAt=Date.now();return write(col+id,function(){return db.collection(col).doc(id).update(data)})}
function sub(col,key){
  db.collection(col).onSnapshot(function(snap){
    S[key]=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o}).filter(function(o){return !o.deleted});
    if(!snap.metadata.fromCache||snap.docs.length)S.loaded[key]=true;
    if(!snap.metadata.fromCache){S.loaded[key]=true}
    names();onData(key);
  },function(e){S.loaded[key]=true;note('자료를 불러오지 못했습니다. 페이지를 닫았다 다시 열어 주세요.');render()});
}
function names(){
  if(!user||!user.profiles)return;var ids={};
  S.items.concat(S.comments,S.refs).forEach(function(o){if(o.by&&!(o.by in S.names))ids[o.by]=1});
  ids=Object.keys(ids);if(!ids.length)return;ids.forEach(function(i){S.names[i]=''});
  user.profiles(ids.slice(0,64)).then(function(ps){ids.forEach(function(i){S.names[i]=(ps&&ps[i]&&ps[i].name)||''});render(true)}).catch(function(){});
}
function onData(key){
  if(key==='channels'){if(S.channels.length&&!S.channels.some(function(c){return c.id===S.ch}))S.ch=S.channels.slice().sort(byOrder)[0].id;head()}
  render(true);
}
function byOrder(a,b){return (a.order||0)-(b.order||0)||(a.at||0)-(b.at||0)}

/* ---------- 화면 ---------- */
function head(){
  var sel=document.getElementById('chSel');
  sel.innerHTML=S.channels.slice().sort(byOrder).map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===S.ch?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')||'<option>크리에이터 없음</option>';
  [].forEach.call(document.querySelectorAll('[data-tab]'),function(b){b.classList.toggle('on',b.dataset.tab===S.tab&&!S.open)});
}
function render(soft){
  head();
  var ready=S.loaded.channels&&S.loaded.items&&S.loaded.refs;
  if(!ready)return;
  if(soft&&document.activeElement&&app.contains(document.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){softSync();return}
  if(S.tab==='people'){app.innerHTML=peopleHtml();return}
  if(S.addCh){app.innerHTML=chForm();return}
  if(!S.channels.length){app.innerHTML='<div class="empty" style="margin-top:24px">아직 크리에이터가 없습니다.<br><br><button class="btn pri" data-act="addCh">첫 크리에이터 만들기</button></div>';return}
  if(S.open){var it=S.items.filter(function(i){return i.id===S.open})[0];if(it){app.innerHTML=editor(it);return}S.open=null}
  if(S.refEdit){app.innerHTML=refForm();return}
  app.innerHTML=S.tab==='people'?peopleHtml():S.tab==='refs'?refs():S.tab==='concept'?concept():board();
}
/* 입력 중일 때는 화면을 다시 그리지 않고, 상대가 바꾼 다른 칸만 맞춘다 */
function softSync(){
  if(S.tab==='concept'&&!S.open){var c=curConcept();[].forEach.call(app.querySelectorAll('[data-c]'),function(el){if(el!==document.activeElement&&!el.dataset.dirty){var v=c[el.dataset.c]==null?'':String(c[el.dataset.c]);if(el.value!==v)el.value=v}});var g=document.getElementById('grow');if(g)g.innerHTML=growStats(c);return}
  if(S.open){var it=S.items.filter(function(i){return i.id===S.open})[0];if(!it)return;
    [].forEach.call(app.querySelectorAll('[data-f]'),function(el){if(el!==document.activeElement&&!el.dataset.dirty){var v=it[el.dataset.f]==null?'':String(it[el.dataset.f]);if(el.value!==v)el.value=v}});
    var sc=it.scenes||[];[].forEach.call(app.querySelectorAll('[data-sc]'),function(el){if(el!==document.activeElement&&!sceneDirty){var a=el.dataset.sc.split(':'),r=sc[+a[0]];if(r){var v=r[a[1]]==null?'':String(r[a[1]]);if(el.value!==v)el.value=v}}});
    var k=document.getElementById('calc');if(k)k.innerHTML=calc(it);
    var c=document.getElementById('cms');if(c)c.innerHTML=cmList(it.id)}
}

function board(){
  var items=S.items.filter(function(i){return i.ch===S.ch});
  var cnt={};items.forEach(function(i){cnt[i.stage]=(cnt[i.stage]||0)+1});
  var h='<div class="bar"><button class="chip'+(S.stage==='all'?' on':'')+'" data-stage="all">전체<b>'+items.length+'</b></button>';
  STAGES.forEach(function(s){h+='<button class="chip'+(S.stage===s?' on':'')+'" data-stage="'+s+'">'+s+'<b>'+(cnt[s]||0)+'</b></button>'});
  h+='<span class="sp"></span><button class="btn pri" data-act="newItem">새 콘텐츠</button></div>';

function readScenes(){var rows=[];[].forEach.call(app.querySelectorAll('[data-sc]'),function(el){var a=el.dataset.sc.split(':');(rows[+a[0]]=rows[+a[0]]||{})[a[1]]=el.value});return rows}

function saveField(el){
  var id=S.open,f=el.dataset.f,v=el.value;if(!id||S.ro)return;

    upd('items',id,d).then(function(){delete el.dataset.dirty;var s=document.getElementById('saved');if(s&&!S.ro)s.textContent='저장됨'})},f==='stage'||f==='due'?0:700);
}

  var b=e.target.closest('[data-sec],[data-tab],[data-act],[data-stage],[data-form],[data-next],[data-refedit],[data-open],[data-step],[data-unref],[data-scdel]');if(!b)return;var d=b.dataset;

  if(d.next){e.stopPropagation();var it=S.items.filter(function(i){return i.id===d.next})[0];if(it){var nx=STAGES[STAGES.indexOf(it.stage)+1];if(nx)upd('items',it.id,{stage:nx})}return}
  if(d.refedit){S.refEdit=d.refedit;return render()}

    case 'del':var id=S.open;S.open=null;upd('items',id,{deleted:true});toast('콘텐츠를 지웠습니다',{col:'items',id:id});return render();
    case 'undo':if(S.undo){var u=S.undo;upd(u.col,u.id,{deleted:false});S.undo=null;document.getElementById('toast').style.display='none'}return;
    case 'scAdd':var ra=readScenes();ra.push({k:'',screen:'',line:'',sec:''});saveScenes(ra,true).then(function(){render()});return;
    case 'cmAdd':var ti=document.getElementById('cmIn'),tx=(ti.value||'').trim();if(!tx)return;ti.value='';var item=S.open;
      write('cmnew',function(){return db.collection('comments').add({item:item,text:tx,by:S.me,at:Date.now()})});return;
    case 'pass':S.pass=!S.pass;return render();
    case 'group':S.group=!S.group;return render();
    case 'newRef':S.refEdit='new';return render();
    case 'refCancel':S.refEdit=null;return render();
    case 'refDel':var rid=S.refEdit;S.refEdit=null;upd('refs',rid,{deleted:true});toast('인플루언서를 지웠습니다',{col:'refs',id:rid});return render();
    case 'refSave':var o={};[].forEach.call(app.querySelectorAll('[data-r]'),function(el){o[el.dataset.r]=el.value.trim()});
      if(!o.account)return;o.account=o.account.replace(/^@/,'');o.followers=num(o.followers);o.median=num(o.median);o.views=num(o.views);o.updatedAt=Date.now();
      var re=S.refEdit;S.refEdit=null;

      else write('refs'+re,function(){return db.collection('refs').doc(re).update(o)});
      return render();
  }
});

  if(a==='tAdd'){var q=document.getElementById('tNewQ'),v=(q.value||'').trim();if(!v){q.focus();return}var tg=document.getElementById('tNewT');
    write('tnew',function(){return db.collection('talks').add({ch:S.ch,scope:d.scope,q:v,target:tg?tg.value:'',by:S.me,at:Date.now()})});q.value='';return}
  var t=(S.talks||[]).filter(function(x){return x.id===d.id})[0];if(!t)return;
  var inEl=app.querySelector('[data-tin="'+d.id+'"]'),tx=inEl?(inEl.value||'').trim():'';
  if(a==='tSay'){if(!tx)return;inEl.value='';write('cm'+t.id,function(){return db.collection('comments').add({talk:t.id,text:tx,by:S.me,role:S.role,at:Date.now()})});return}
  if(a==='tRe'){upd('talks',t.id,{decided:'',decidedBy:'',decidedAt:0});return}
  if(a==='tOk'){var ms=(S.comments||[]).filter(function(c){return c.talk===t.id}).sort(function(x,y){return (x.at||0)-(y.at||0)});
    var v2=tx;if(!v2){if(inEl){inEl.value=ms.length?ms[0].text:'';inEl.placeholder='무엇으로 정했는지 적어 주세요';inEl.focus();inEl.select()}note('정할 내용을 칸에 적었습니다. 맞으면 정함을 한 번 더 눌러 주세요.');return}
    if(tx)write('cm'+t.id,function(){return db.collection('comments').add({talk:t.id,text:tx,by:S.me,role:S.role,at:Date.now()})});
    note('');
    upd('talks',t.id,{decided:v2,decidedBy:S.me,decidedAt:Date.now()});
    if(t.target){if(/^c\d$/.test(t.scope)){var c=curConcept(),old=String(c[t.target]||'').trim(),nv=old&&old!==v2&&/^(axes|week|show|dont|tag)$/.test(t.target)?old+'\n'+v2:v2;var o={updatedAt:Date.now()};o[t.target]=nv;
        var ref=db.collection('concepts').doc(S.ch);write('concepts'+S.ch,function(){return S.concepts.some(function(x){return x.id===S.ch})?ref.update(o):ref.set(o)})}
      else if(t.scope.indexOf('i:')===0){var o2={};o2[t.target]=v2;upd('items',t.scope.slice(2),o2)}}
    return}
}
/* ---------- 사람 (PD만) ---------- */
var PEOPLE=null;
function peopleHtml(){
  if(PEOPLE===null){call('/users').then(function(j){PEOPLE=j.users||[];render()});return '<div class="empty">불러오는 중입니다</div>'}
  var h='<div class="bar"><h2 class="h1">같이 쓰는 사람</h2></div><div class="panel"><p class="guide">이름과 비밀번호를 정해 카톡으로 이 주소와 함께 따로 보내 주세요. 비밀번호는 6자 이상.</p>';
  PEOPLE.forEach(function(u){h+='<div class="prow"><b>'+esc(u.name)+'</b><span>'+(u.role==='pd'?'PD':'크리에이터')+(u.off?' · 멈춤':'')+'</span>'+(u.id===S.me?'<span class="me">나</span>':'<button class="btn sm" data-act="pPw" data-id="'+esc(u.id)+'">비밀번호 바꾸기</button><button class="btn sm'+(u.off?'':' bad')+'" data-act="pOff" data-id="'+esc(u.id)+'" data-off="'+(u.off?0:1)+'">'+(u.off?'다시 쓰게':'못 들어오게')+'</button>')+'</div>'});
  h+='<div class="pnew"><input id="pName" placeholder="이름"><select id="pRole"><option value="creator">크리에이터</option><option value="pd">PD</option></select><input id="pPwIn" placeholder="비밀번호 (6자 이상)"><button class="btn pri" data-act="pAdd">사람 더하기</button></div><p id="pMsg" class="guide"></p>';
  h+='<div class="prow"><b>내 비밀번호</b><span></span><button class="btn sm" data-act="pPw" data-id="'+esc(S.me)+'">바꾸기</button></div></div>';
  return h;
}
var PERR={dup:'같은 이름이 이미 있습니다.',pw:'비밀번호는 6자 이상으로 해 주세요.',name:'이름을 20자 안으로 적어 주세요.',forbidden:'PD만 할 수 있습니다.'};
function peopleAct(a,d){
  var m=document.getElementById('pMsg');
  if(a==='pAdd'){var n=document.getElementById('pName').value.trim(),p=document.getElementById('pPwIn').value,r=document.getElementById('pRole').value;
    call('/users/add',{name:n,role:r,pw:p}).then(function(j){if(j.ok){PEOPLE=null;render();note(n+' 님을 더했습니다. 이름과 비밀번호를 따로 보내 주세요.')}else if(m)m.textContent=PERR[j.err]||'더하지 못했습니다.'});return}
  if(a==='pOff'){call('/users/set',{id:d.id,off:d.off==='1'}).then(function(){PEOPLE=null;render()});return}
  if(a==='pPw'){var row=app.querySelector('[data-act="pPw"][data-id="'+d.id+'"]').parentNode;if(row.querySelector('input'))return;
    row.insertAdjacentHTML('beforeend','<input class="pnpw" placeholder="새 비밀번호"><button class="btn sm pri" data-act="pPwGo" data-id="'+esc(d.id)+'">저장</button>');row.querySelector('input').focus();return}
  if(a==='pPwGo'){var row2=app.querySelector('[data-act="pPwGo"][data-id="'+d.id+'"]').parentNode,v=row2.querySelector('input').value;
    call('/users/set',{id:d.id,pw:v}).then(function(j){if(j.ok){if(d.id===S.me){sess(null);showLogin('비밀번호를 바꿨습니다. 새 비밀번호로 들어와 주세요.')}else{PEOPLE=null;render();note('비밀번호를 바꿨습니다.')}}else note(PERR[j.err]||'바꾸지 못했습니다.')});return}
}
/* ---------- 저장 서버 연결 (계정 없이 이름 + 비밀번호) ---------- */
var API=(window.APP_CFG&&APP_CFG.api)||'';
var SK='ip_session';
function sess(v){try{if(v===undefined)return JSON.parse(localStorage.getItem(SK)||'null');if(v===null)localStorage.removeItem(SK);else localStorage.setItem(SK,JSON.stringify(v))}catch(e){return null}}
function call(path,body){var s=sess();return fetch(API+path,{method:'POST',headers:Object.assign({'content-type':'application/json'},s&&s.token?{authorization:'Bearer '+s.token}:{}),body:JSON.stringify(body||{})}).then(function(r){return r.json().catch(function(){return {err:'net'}}).then(function(j){if(r.status===401){sess(null);showLogin('로그인이 풀렸습니다. 다시 들어와 주세요.')}return j})})}
var CACHE={},SUBS={},SINCE=0,PULLING=false;
function emit(col){var m=CACHE[col]||{};var docs=Object.keys(m).map(function(id){return {id:id,data:function(){return m[id]}}});(SUBS[col]||[]).forEach(function(f){f({docs:docs,metadata:{fromCache:false}})})}
function pull(){if(PULLING)return Promise.resolve();PULLING=true;return call('/pull',{since:SINCE}).then(function(j){PULLING=false;if(!j||j.err){if(j&&j.err==='net')note('서버에 닿지 않습니다. 인터넷 연결을 확인해 주세요.');return}
  Object.assign(S.names,j.names||{});var ch={};(j.docs||[]).forEach(function(d){(CACHE[d.col]=CACHE[d.col]||{})[d.id]=d.data;ch[d.col]=1;if(d.upd>SINCE)SINCE=d.upd});
  ['channels','items','refs','comments','concepts','talks'].forEach(function(c){if(ch[c]||!S.loaded[c])emit(c)})}).catch(function(){PULLING=false;note('서버에 닿지 않습니다. 인터넷 연결을 확인해 주세요.')})}
function send(col,id,op,data){(CACHE[col]=CACHE[col]||{});CACHE[col][id]=op==='update'?Object.assign({},CACHE[col][id],data):data;emit(col);
  return call('/write',{list:[{col:col,id:id,op:op,data:data}]}).then(function(j){var o=j&&j.out&&j.out[0];if(!o||!o.ok){var e=new Error('save');e.code=j&&j.err;throw e}})}
function newId(){var a=new Uint8Array(10);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(x){return 'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]}).join('')}
var db={collection:function(col){return {
  doc:function(id){id=id||newId();return {id:id,set:function(d){return send(col,id,'set',d)},update:function(d){return send(col,id,'update',d)}}},
  add:function(d){return send(col,newId(),'set',d)},
  onSnapshot:function(f){(SUBS[col]=SUBS[col]||[]).push(f)}}}};
var user=null;
function showLogin(why){var g=document.getElementById('login');g.hidden=false;checkSetup();document.getElementById('lgErr').textContent=why||'';var n=document.getElementById('lgName');(n.value?document.getElementById('lgPw'):n).focus()}
function started(me){S.me=me.id;S.role=me.role;S.names[me.id]=me.name;document.getElementById('login').hidden=true;document.getElementById('meName').textContent=me.name+(me.role==='pd'?' · PD':' · 크리에이터');document.body.classList.toggle('is-pd',me.role==='pd');
  sub('channels','channels');sub('items','items');sub('refs','refs');sub('comments','comments');sub('concepts','concepts');sub('talks','talks');
  pull();setInterval(function(){if(!document.hidden)pull()},4000);document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()})}
var SETUP=false;
function setupMode(on){SETUP=on;document.getElementById('lgSet').hidden=!on;document.getElementById('lgPw2L').hidden=!on;document.getElementById('lgPwL').textContent=on?'비밀번호 정하기 (6자 이상)':'비밀번호';document.getElementById('lgBtn').textContent=on?'시작하기':'들어가기';document.getElementById('lgPw').autocomplete=on?'new-password':'current-password'}
function checkSetup(){call('/state',{}).then(function(j){setupMode(!!(j&&j.setup))})}
document.getElementById('lgForm').addEventListener('submit',function(e){e.preventDefault();var b=document.getElementById('lgBtn');
  if(SETUP){var p1=document.getElementById('lgPw').value,p2=document.getElementById('lgPw2').value;if(p1.length<6){document.getElementById('lgErr').textContent='비밀번호는 6자 이상으로 정해 주세요.';return}if(p1!==p2){document.getElementById('lgErr').textContent='두 비밀번호가 다릅니다. 같게 넣어 주세요.';return}}
  b.disabled=true;
  call('/login',{name:document.getElementById('lgName').value,pw:document.getElementById('lgPw').value}).then(function(j){b.disabled=false;
    if(j&&j.token){sess({token:j.token,me:j.me});document.getElementById('lgPw').value='';document.getElementById('lgPw2').value='';setupMode(false);started(j.me)}
    else document.getElementById('lgErr').textContent=j&&j.err==='locked'?'여러 번 틀려 잠시 잠겼습니다. '+(j.wait||15)+'분 뒤 다시 해 주세요.':j&&j.err==='net'?'서버에 닿지 않습니다.':'이름 또는 비밀번호가 맞지 않습니다.'})});
/* ---------- 시작 ---------- */
head();
document.getElementById('brand').textContent=document.title=(window.APP_CFG&&APP_CFG.name)||'인스타그램 기획';document.getElementById('lgTitle').textContent=document.title;
var S0=sess();if(S0&&S0.token){started(S0.me);call('/me').then(function(j){if(j&&j.me){sess({token:S0.token,me:j.me});S.role=j.me.role;document.body.classList.toggle('is-pd',j.me.role==='pd')}})}else showLogin();
})();
</script>
